<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejoindre un partage Gamoria</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 360px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { font-size: 15px; color: #bbb; line-height: 1.5; }
  .code {
    display: inline-block;
    margin: 16px 0;
    padding: 10px 18px;
    background: #2a2a40;
    border: 2px solid #6c63ff;
    border-radius: 8px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  a.btn {
    display: inline-block;
    margin-top: 12px;
    padding: 12px 24px;
    background: #6c63ff;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Rejoindre un partage Gamoria</h1>
    <p id="msg">Ouverture de l'app…</p>
    <div class="code" id="code" style="display:none"></div>
    <p id="fallback" style="display:none">
      Si l'app ne s'ouvre pas automatiquement, ouvre Gamoria et colle ce code
      dans « Profil &gt; Partage wishlist &gt; Rejoindre un ami ».
    </p>
    <a class="btn" id="retry" href="#" style="display:none">Ouvrir Gamoria</a>
  </div>
  <script>
    var code = new URLSearchParams(window.location.search).get('code');
    var msg = document.getElementById('msg');
    var codeEl = document.getElementById('code');
    var fallback = document.getElementById('fallback');
    var retry = document.getElementById('retry');

    if (!code) {
      msg.textContent = 'Lien invalide : code manquant.';
    } else {
      var deepLink = 'gamoria://join/' + encodeURIComponent(code);
      codeEl.textContent = code;
      codeEl.style.display = 'inline-block';
      fallback.style.display = 'block';
      retry.href = deepLink;
      retry.style.display = 'inline-block';
      msg.textContent = 'Ouverture de Gamoria…';
      window.location.href = deepLink;
    }
  </script>
</body>
</html>
